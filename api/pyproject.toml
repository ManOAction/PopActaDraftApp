[project]
name = "popacta-api"
version = "0.1.0"
description = "Draft-day copilot backend for the Pop Acta Premier League"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/popacta"]

# --- ruff ---------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (includes E722, bare except)
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific
    "ANN",  # flake8-annotations — type hints on public signatures
    # Swallowed exceptions, selected individually rather than pulling in all of
    # flake8-bandit. "Fail loudly at import time, never silently at draft time"
    # is the project's central rule; LEG-4 shipped because a parse failure was
    # caught and defaulted to 0.
    "S110", # try-except-pass
    "S112", # try-except-continue
]
ignore = [
    "ANN401",  # Any is occasionally the honest annotation
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",   # test functions don't need return annotations
    "S101",  # assert is the point
]

[tool.ruff.lint.isort]
known-first-party = ["popacta"]

# --- pytest -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
