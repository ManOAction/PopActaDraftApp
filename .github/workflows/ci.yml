name: CI

# Commands here must stay identical to the Commands tables in the root CLAUDE.md
# and web/CLAUDE.md. If CI and local drift, CI stops being evidence of anything.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact release, not a moving major tag: astral-sh/setup-uv
      # publishes releases up to v9.x but its major tags stop at v7, so `@v9`
      # is unresolvable and fails at "Set up job" before any step runs.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Sync dependencies
        run: uv sync --project api --locked

      - name: Lint
        run: uv run --project api ruff check api

      - name: Format check
        run: uv run --project api ruff format --check api

      # The `api` path argument is load-bearing: without it pytest sets rootdir to
      # the repo root, finds no config, and silently ignores api/pyproject.toml's
      # [tool.pytest.ini_options] — including --strict-config. Tests still "pass".
      - name: Test
        run: uv run --project api pytest api

  web:
    name: web (typescript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # `npm run build` runs `tsc -b` first, so this covers typecheck too.
      - name: Build
        run: npm run build

  design-loop:
    name: design loop (playwright)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Exits non-zero on any console or page error, so this is a real smoke test
      # of the app booting and rendering — not just a screenshot job.
      - name: Render and screenshot
        run: npm run screenshot

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: web/screenshots/
          retention-days: 7
